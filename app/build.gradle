plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aj.firelauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aj.firelauncher'
        minSdk 23
        targetSdk 28
        versionCode 7
        versionName '0.6.1'
    }

    signingConfigs {
        release {
            if (System.getenv('AJ_KEYSTORE_PATH')) {
                storeFile file(System.getenv('AJ_KEYSTORE_PATH'))
                storePassword System.getenv('AJ_KEYSTORE_PASSWORD')
                keyAlias 'aj-launcher'
                keyPassword System.getenv('AJ_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
        }
        release {
            if (System.getenv('AJ_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Native filtering engine is built from pinned source; no prebuilt binaries are committed.
def buildBlocker = tasks.register('buildBlocker', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/build-blocker.py'
    inputs.dir rootProject.file('native/blocker/src')
    inputs.file rootProject.file('native/blocker/Cargo.toml')
    inputs.file rootProject.file('native/blocker/Cargo.lock')
    outputs.dir layout.buildDirectory.dir('generated/blockerJni')
    outputs.file rootProject.file('app/src/main/assets/licenses/native-dependencies.txt')
}
android.sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('generated/blockerJni'))
tasks.named('preBuild').configure { dependsOn buildBlocker }
