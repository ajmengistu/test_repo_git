[package]
name = "ajblock"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { git = "https://github.com/brave/adblock-rust", rev = "6028a6d5735f1e81346eeef73c194c7240035248", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "=0.21.1"
serde_json = "=1.0.149"

[profile.release]
lto = true
strip = true
codegen-units = 1
