name: Build APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare source-built filter engine
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustup target add armv7-linux-androideabi aarch64-linux-android
          if [ ! -f native/blocker/Cargo.lock ]; then cargo generate-lockfile --manifest-path native/blocker/Cargo.toml; fi
          cargo test --locked --manifest-path native/blocker/Cargo.toml

      - name: Test, lint and build APKs
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJ-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AJ-Launcher-validation
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            native/blocker/Cargo.lock
