name: Signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.4)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare source-built filter engine
        if: hashFiles('native/blocker/Cargo.toml') != ''
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustup target add armv7-linux-androideabi aarch64-linux-android
          cargo test --locked --manifest-path native/blocker/Cargo.toml
      - name: Restore private release key
        env:
          AJ_KEYSTORE_BASE64: ${{ secrets.AJ_KEYSTORE_BASE64 }}
        run: |
          test -n "$AJ_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$AJ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aj-release.jks"
      - name: Test and build signed APK
        env:
          AJ_KEYSTORE_PATH: ${{ runner.temp }}/aj-release.jks
          AJ_KEYSTORE_PASSWORD: ${{ secrets.AJ_KEYSTORE_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --console=plain
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          APK="AJ-Launcher-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$RELEASE_TAG" "$APK" "$APK.sha256" \
            --verify-tag --title "AJ Launcher $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK" \
            --output "$RUNNER_TEMP/downloaded.apk"
          cmp "$APK" "$RUNNER_TEMP/downloaded.apk"
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/aj-release.jks"
